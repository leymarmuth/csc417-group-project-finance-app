name: Android smoke test

# Installs the newest Aurum.apk release on an Android emulator, signs in with the
# demo account, relaunches the app and visits every tab. Uploads logcat + screenshots.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Android APK]
    types: [completed]

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Download latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --pattern Aurum.apk -R ${{ github.repository }}

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p smoke && adb install -r Aurum.apk && adb logcat -c && (python3 scripts/android-smoke-test.py | tee smoke/result.txt; adb logcat -d > smoke/logcat.txt; adb logcat -d -b crash > smoke/crash.txt; grep -q "RESULT: PASS" smoke/result.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
