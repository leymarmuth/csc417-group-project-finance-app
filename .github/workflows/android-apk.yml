name: Android APK

# Builds an installable Android APK of Aurum and publishes it as a GitHub Release.
# Stable download link (always the newest build):
#   https://github.com/leymarmuth/csc417-group-project-finance-app/releases/latest/download/Aurum.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_NO_TELEMETRY: 1
          NODE_ENV: production

      - name: Sign APK with the Aurum release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out Aurum.apk android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs Aurum.apk | head -3
          rm release.keystore
          ls -lh Aurum.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-apk
          path: Aurum.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="android-v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" Aurum.apk \
            --title "Aurum ${VERSION} (Android build ${{ github.run_number }})" \
            --notes "Install on Android: download **Aurum.apk** on your phone, open it, and allow installing from this source if asked. Built from ${GITHUB_SHA::7}." \
            --latest
